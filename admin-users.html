<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("diva_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Management — DIVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-shell-root"></div>

<template id="admin-users-content">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
    <div>
      <span class="eyebrow">Accounts</span>
      <h1 style="font-family:var(--font-display); font-weight:700; font-size:1.4rem; color:var(--canvas-heading); margin:.25rem 0 0;">User management</h1>
    </div>
    <input type="search" class="form-control form-control-diva" id="userSearch" placeholder="Search by name or email…" style="max-width:260px;">
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="diva-card diva-card-dark reveal-on-scroll">
        <div class="card-eyebrow"><span>Total Accounts</span><span class="icon-chip tone-cyan"><i class="bi bi-people dicon" data-dicon="people"></i></span></div>
        <h3 class="card-num" id="uTotal">0</h3>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="diva-card diva-card-dark reveal-on-scroll">
        <div class="card-eyebrow"><span>Administrators</span><span class="icon-chip tone-warning"><i class="bi bi-shield-check dicon" data-dicon="shield-check"></i></span></div>
        <h3 class="card-num" id="uAdmins">0</h3>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="diva-card diva-card-dark reveal-on-scroll">
        <div class="card-eyebrow"><span>Residents</span><span class="icon-chip tone-safe"><i class="bi bi-house dicon" data-dicon="house"></i></span></div>
        <h3 class="card-num" id="uResidents">0</h3>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="diva-card diva-card-dark reveal-on-scroll">
        <div class="card-eyebrow"><span>Suspended</span><span class="icon-chip tone-critical"><i class="bi bi-slash-circle dicon" data-dicon="slash-circle"></i></span></div>
        <h3 class="card-num" id="uSuspended">0</h3>
      </div>
    </div>
  </div>

  <div class="diva-card reveal-on-scroll">
    <div class="card-eyebrow"><span>All accounts</span></div>
    <div class="table-diva-wrap cards-on-mobile">
      <table class="table-diva">
        <thead>
          <tr><th>Name</th><th>Email</th><th>City</th><th>Role</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  const user = renderAppShell("admin-users.html", { title: "User Management" });
  if (user && !DivaAuth.isAdmin(user)) { window.location.href = "dashboard.html"; }

  function renderUsers(query) {
    const all = DivaStore.getUsers();
    document.getElementById("uTotal").textContent = all.length;
    document.getElementById("uAdmins").textContent = all.filter((u) => u.role === "Administrator").length;
    document.getElementById("uResidents").textContent = all.filter((u) => u.role === "Community Resident").length;
    document.getElementById("uSuspended").textContent = all.filter((u) => u.status === "suspended").length;

    const q = (query || "").trim().toLowerCase();
    const filtered = q ? all.filter((u) => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)) : all;

    const body = document.getElementById("usersTableBody");
    body.innerHTML = "";
    filtered.forEach((u) => {
      const isSelf = u.email === user.email;
      const isSuspended = u.status === "suspended";
      const isAdminRole = u.role === "Administrator";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td data-label="Name"><strong>${u.name}</strong>${isSelf ? ' <span class="cell-muted">(you)</span>' : ""}</td>
        <td data-label="Email" class="cell-muted">${u.email}</td>
        <td data-label="City" class="cell-muted">${u.city || "—"}</td>
        <td data-label="Role"><span class="status-badge ${isAdminRole ? "status-warning" : "status-safe"}">${u.role}</span></td>
        <td data-label="Status"><span class="status-badge ${isSuspended ? "status-critical" : "status-safe"}">${isSuspended ? "Suspended" : "Active"}</span></td>
        <td class="text-end row-actions">
          <div class="d-flex gap-1 justify-content-end flex-wrap">
            <button type="button" class="btn-diva btn-diva-ghost btn-diva-sm" data-action="toggle-role" data-email="${u.email}" ${isSelf ? "disabled" : ""}>${isAdminRole ? "Make Resident" : "Make Admin"}</button>
            <button type="button" class="btn-diva btn-diva-ghost btn-diva-sm" data-action="toggle-status" data-email="${u.email}" ${isSelf ? "disabled" : ""}>${isSuspended ? "Reactivate" : "Suspend"}</button>
          </div>
        </td>`;
      body.appendChild(tr);
    });
  }

  function initAdminUsersPage() {
    document.getElementById("app-content").appendChild(document.getElementById("admin-users-content").content.cloneNode(true));
    initializeAnimations();
    renderUsers("");

    document.getElementById("userSearch").addEventListener("input", (e) => renderUsers(e.target.value));

    document.getElementById("usersTableBody").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn || btn.disabled) return;
      const email = btn.dataset.email;
      const target = DivaStore.findUser(email);
      if (!target) return;

      if (btn.dataset.action === "toggle-role") {
        const nextRole = target.role === "Administrator" ? "Community Resident" : "Administrator";
        DivaStore.updateUser(email, { role: nextRole });
        divaToast(`${target.name} is now ${nextRole}`, "bi-check-circle");
      } else if (btn.dataset.action === "toggle-status") {
        const nextStatus = target.status === "suspended" ? "active" : "suspended";
        DivaStore.updateUser(email, { status: nextStatus });
        divaToast(nextStatus === "suspended" ? `${target.name} suspended` : `${target.name} reactivated`, nextStatus === "suspended" ? "bi-slash-circle" : "bi-check-circle");
      }
      renderUsers(document.getElementById("userSearch").value);
    });
  }

  if (user && DivaAuth.isAdmin(user)) initAdminUsersPage();
</script>
</body>
</html>
