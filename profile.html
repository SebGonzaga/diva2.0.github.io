<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — DIVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-shell-root"></div>

<template id="profile-content">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="diva-card reveal-on-scroll text-center mb-4">
        <div class="avatar mx-auto mb-3" style="width:64px;height:64px;border-radius:50%;background:var(--navy-900);color:var(--accent-cyan);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;" id="profileAvatar"></div>
        <h3 style="font-weight:700; color:var(--navy-950);" id="profileName"></h3>
        <span class="status-badge status-safe" id="profileRole"></span>
      </div>
      <div class="diva-card reveal-on-scroll">
        <div class="mb-3"><span class="text-muted-diva" style="font-size:.82rem;">Email</span><div style="font-weight:600;" id="profileEmail"></div></div>
        <div class="mb-3"><span class="text-muted-diva" style="font-size:.82rem;">City</span><div style="font-weight:600;">Calamba, Laguna</div></div>
        <div><span class="text-muted-diva" style="font-size:.82rem;">Account type</span><div style="font-weight:600;" id="profileRole2"></div></div>
      </div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/main.js"></script>
<script>
  const user = renderAppShell("profile.html", { title: "Profile" });
  if (user) {
    document.getElementById("app-content").appendChild(document.getElementById("profile-content").content.cloneNode(true));
    document.getElementById("profileAvatar").textContent = user.name.split(" ").map((s) => s[0]).slice(0, 2).join("").toUpperCase();
    document.getElementById("profileName").textContent = user.name;
    document.getElementById("profileRole").textContent = user.role;
    document.getElementById("profileEmail").textContent = user.email;
    document.getElementById("profileRole2").textContent = user.role;
    initializeAnimations();
  }
</script>
</body>
</html>
