<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("rain_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Incident Reports — RAIN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1830">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>
<div id="app-shell-root"></div>

<template id="admin-incidents-content">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
    <div>
      <span class="eyebrow">Resident Reports</span>
      <h1 style="font-family:var(--font-display); font-weight:700; font-size:1.4rem; color:var(--canvas-heading); margin:.25rem 0 0;">Incident report queue</h1>
    </div>
    <div class="d-flex flex-wrap gap-2" id="incidentFilters">
      <button class="btn-rain btn-rain-ghost btn-rain-sm active-filter" data-filter="all">All</button>
      <button class="btn-rain btn-rain-ghost btn-rain-sm" data-filter="Pending">Pending</button>
      <button class="btn-rain btn-rain-ghost btn-rain-sm" data-filter="Reviewed">Reviewed</button>
      <button class="btn-rain btn-rain-ghost btn-rain-sm" data-filter="Resolved">Resolved</button>
    </div>
  </div>

  <div class="d-flex flex-column gap-3" id="incidentsList"></div>
  <div class="empty-state d-none" id="incidentsEmpty">
    <div class="glyph"><i class="bi bi-inbox dicon" data-dicon="inbox"></i></div>
    <div>No incident reports in this category yet.</div>
  </div>
  <!-- Resolve / Pending email modal -->
  <div class="modal fade modal-rain" id="statusModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="statusModalTitle">Mark resolved</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="cell-muted" id="statusModalIntro" style="font-size:.85rem;"></p>
          <label class="form-label" for="statusMessage" id="statusMessageLabel">Message to the resident</label>
          <textarea class="form-control mb-3" id="statusMessage" rows="4" maxlength="1500"></textarea>
          <div id="proofGroup">
            <label class="form-label" for="proofFile">Proof photo <span class="text-danger">*</span></label>
            <input type="file" class="form-control" id="proofFile" accept="image/*">
            <img id="proofPreview" alt="Proof preview" class="d-none mt-2" style="max-width:100%; max-height:200px; border-radius:8px; object-fit:cover;">
          </div>
          <div id="pendingInfo" class="d-none cell-muted" style="font-size:.82rem;">
            <i class="bi bi-info-circle"></i> The email will also list the 3 nearest evacuation centers and the emergency hotlines automatically.
          </div>
          <div class="text-danger small mt-2 d-none" id="statusError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-rain btn-rain-ghost btn-rain-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-rain btn-rain-primary btn-rain-sm" id="statusSubmit">Send &amp; save</button>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/rain-auth.js"></script>
<script src="assets/js/offline-store.js"></script>
<script src="assets/js/main.js"></script>
<script type="module">
  await RainAuth.init();
  const user = renderAppShell("admin-incidents.html", { title: "Incident Reports" });
  if (user && !RainAuth.isAdmin(user)) { window.location.href = "dashboard.html"; }

  const statusTone = { Pending: "status-warning", Reviewed: "status-caution", Resolved: "status-safe" };
  const typeIcon = { Ashfall: "bi-cloud-haze2", "Ground cracks": "bi-layers", "Gas smell": "bi-wind", Flooding: "bi-water", Landslide: "bi-layers", "Earthquake damage": "bi-activity", Other: "bi-flag" };

  // UI shows "Pending / Reviewed / Resolved"; the DB enum (see
  // supabase/schema.sql) uses "pending / verified / resolved / dismissed".
  const STATUS_DB_TO_UI = { pending: "Pending", verified: "Reviewed", resolved: "Resolved", dismissed: "Dismissed" };
  const STATUS_UI_TO_DB = { Pending: "pending", Reviewed: "verified", Resolved: "resolved" };

  function escapeHtml(t) { return String(t ?? "").replace(/[&<>\"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function fmt(ts) {
    if (!ts) return "—";
    const d = new Date(ts);
    return isNaN(d) ? ts : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  // Same fix as admin-users.html: PostgREST caps a single request at 1000
  // rows, so a plain .select() would silently truncate once incidents
  // passed that count, drifting from the dashboard's exact count() total.
  // Page through until a short page tells us we've hit the end.
  const FETCH_PAGE_SIZE = 1000;
  async function fetchIncidents() {
    const all = [];
    let from = 0;
    while (true) {
      const { data, error } = await sb
        .from("incidents")
        .select("*, profiles!reporter_id(full_name)")
        .order("created_at", { ascending: false })
        .range(from, from + FETCH_PAGE_SIZE - 1);
      if (error) { console.error("Fetch incidents error:", error); return all; }
      all.push(...data);
      if (data.length < FETCH_PAGE_SIZE) break;
      from += FETCH_PAGE_SIZE;
    }
    return all.map((inc) => ({
      id: inc.id,
      type: inc.category,
      description: inc.description,
      location: inc.area,
      reportedAt: inc.created_at,
      reporterName: inc.profiles?.full_name || "Resident",
      status: STATUS_DB_TO_UI[inc.status] || "Pending",
      photoUrl: inc.photo_url,
      resolutionMessage: inc.resolution_message,
      resolutionPhotoUrl: inc.resolution_photo_url,
    }));
  }

  let incidentCache = {};

  async function renderIncidents(filter) {
    const list = document.getElementById("incidentsList");
    const empty = document.getElementById("incidentsEmpty");
    const all = await fetchIncidents();
    incidentCache = Object.fromEntries(all.map((i) => [i.id, i]));
    const items = filter === "all" ? all : all.filter((i) => i.status === filter);
    list.innerHTML = "";
    empty.classList.toggle("d-none", items.length > 0);

    items.forEach((inc) => {
      const el = document.createElement("div");
      el.className = "rain-card reveal-on-scroll";
      el.style.opacity = "1";
      el.innerHTML = `
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
          <div class="d-flex align-items-center gap-2">
            <span class="icon-chip tone-warning"><i class="bi ${typeIcon[inc.type] || "bi-flag"}"></i></span>
            <div>
              <strong>${inc.type || "Incident"}</strong>
              <div class="cell-muted" style="font-size:.78rem;">Reported by ${inc.reporterName || "Resident"} · ${fmt(inc.reportedAt)}</div>
            </div>
          </div>
          <span class="status-badge ${statusTone[inc.status] || "status-warning"}">${inc.status}</span>
        </div>
        <p style="font-size:.9rem; margin-bottom:.6rem;">${inc.description || "No description provided."}</p>
        ${inc.photoUrl ? `<a href="${inc.photoUrl}" target="_blank" rel="noopener"><img src="${inc.photoUrl}" alt="Incident photo" style="max-width:220px; max-height:160px; border-radius:8px; object-fit:cover; margin-bottom:.6rem; display:block;"></a>` : ""}
        ${inc.status === "Resolved" && inc.resolutionPhotoUrl ? `<div class="mb-3" style="font-size:.82rem;"><strong>Proof of resolution</strong>${inc.resolutionMessage ? `<div class="cell-muted">${escapeHtml(inc.resolutionMessage)}</div>` : ""}<a href="${inc.resolutionPhotoUrl}" target="_blank" rel="noopener"><img src="${inc.resolutionPhotoUrl}" alt="Proof photo" style="max-width:220px; max-height:160px; border-radius:8px; object-fit:cover; margin-top:.3rem; display:block;"></a></div>` : ""}
        <div class="data-source-line mb-3">
          <i class="bi bi-geo-alt"></i> ${inc.location || "Location not provided"}
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn-rain btn-rain-ghost btn-rain-sm" data-status="Pending" data-id="${inc.id}">Mark Pending</button>
          <button type="button" class="btn-rain btn-rain-ghost btn-rain-sm" data-status="Reviewed" data-id="${inc.id}">Mark Reviewed</button>
          <button type="button" class="btn-rain btn-rain-primary btn-rain-sm" data-status="Resolved" data-id="${inc.id}">Mark Resolved</button>
        </div>`;
      list.appendChild(el);
    });
  }

  function initAdminIncidentsPage() {
    document.getElementById("app-content").appendChild(document.getElementById("admin-incidents-content").content.cloneNode(true));
    initializeAnimations();
    renderIncidents("all");

    document.querySelectorAll("#incidentFilters button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#incidentFilters button").forEach((b) => b.classList.remove("active-filter"));
        btn.classList.add("active-filter");
        renderIncidents(btn.dataset.filter);
      });
    });

    const modalEl = document.getElementById("statusModal");
    // .app-content is its own stacking context (position:relative; z-index:1),
    // which traps a modal inside it BELOW Bootstrap's backdrop (on <body>), so
    // nothing in the modal was clickable. Move it to <body> before use.
    document.body.appendChild(modalEl);
    const modal = new bootstrap.Modal(modalEl);
    const $ = (id) => document.getElementById(id);
    let pendingAction = null; // { incident, status: "resolved" | "pending" }

    function showError(msg) { const e = $("statusError"); e.textContent = msg || ""; e.classList.toggle("d-none", !msg); }

    function openStatusModal(incident, status) {
      pendingAction = { incident, status };
      const resolving = status === "resolved";
      $("statusModalTitle").textContent = resolving ? "Mark as resolved" : "Mark as pending";
      $("statusModalIntro").textContent = resolving
        ? `Send ${incident.reporterName} an email confirming "${incident.type}" is resolved, with a photo as proof.`
        : `${incident.reporterName} will get an email telling them to stay safe, with the nearest evacuation centers and emergency contacts.`;
      $("statusMessageLabel").textContent = resolving ? "Message to the resident" : "Extra note (optional)";
      $("statusMessage").value = resolving ? "Our team has addressed the situation you reported. Thank you for letting us know." : "";
      $("proofGroup").classList.toggle("d-none", !resolving);
      $("pendingInfo").classList.toggle("d-none", resolving);
      $("proofFile").value = "";
      $("proofPreview").classList.add("d-none");
      showError("");
      modal.show();
    }

    $("proofFile").addEventListener("change", (e) => {
      const f = e.target.files[0], img = $("proofPreview");
      if (!f) return img.classList.add("d-none");
      img.src = URL.createObjectURL(f);
      img.classList.remove("d-none");
    });

    async function uploadProof(incidentId, file) {
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 5) || "jpg";
      const path = `${incidentId}/${Date.now()}.${ext}`;
      const { error } = await sb.storage.from("incident-proofs").upload(path, file, { contentType: file.type, upsert: false });
      if (error) throw new Error("Photo upload failed: " + error.message);
      return sb.storage.from("incident-proofs").getPublicUrl(path).data.publicUrl;
    }

    async function submitStatus() {
      const { incident, status } = pendingAction;
      const btn = $("statusSubmit");
      showError("");
      let photoUrl = null;
      const file = $("proofFile").files[0];
      if (status === "resolved") {
        if (!file) return showError("Please attach a proof photo.");
        if (!file.type.startsWith("image/")) return showError("The proof must be an image file.");
        if (file.size > 5 * 1024 * 1024) return showError("Photo is too large (max 5 MB).");
      }
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        if (status === "resolved") photoUrl = await uploadProof(incident.id, file);
        const { data: { session } } = await sb.auth.getSession();
        const resp = await fetch("/api/incident-update", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${session?.access_token || ""}` },
          body: JSON.stringify({ incidentId: incident.id, status, message: $("statusMessage").value, photoUrl }),
        });
        const out = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(out.error || "Request failed");
        modal.hide();
        const activeFilter = document.querySelector("#incidentFilters .active-filter").dataset.filter;
        renderIncidents(activeFilter);
        if (out.emailSent) rainToast(`Marked ${status} — email sent`, "bi-envelope-check");
        else rainToast(`Marked ${status}. ${out.reason || "Email not sent."}`, "bi-exclamation-triangle");
      } catch (err) {
        console.error("Status update error:", err);
        showError(err.message);
      } finally {
        btn.disabled = false; btn.textContent = "Send & save";
      }
    }
    $("statusSubmit").addEventListener("click", submitStatus);

    document.getElementById("incidentsList").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-status]");
      if (!btn) return;
      const incident = incidentCache[btn.dataset.id];
      // Resolved / Pending open the email modal; Reviewed is a plain status change.
      if (btn.dataset.status === "Resolved" || btn.dataset.status === "Pending") {
        return openStatusModal(incident, btn.dataset.status.toLowerCase());
      }
      const dbStatus = STATUS_UI_TO_DB[btn.dataset.status];
      const { error } = await sb.from("incidents").update({ status: dbStatus }).eq("id", btn.dataset.id);
      if (error) { console.error("Update incident error:", error); rainToast("Could not update status", "bi-exclamation-triangle"); return; }
      const activeFilter = document.querySelector("#incidentFilters .active-filter").dataset.filter;
      renderIncidents(activeFilter);
      rainToast("Report marked " + btn.dataset.status, "bi-check-circle");
    });
  }

  if (user && RainAuth.isAdmin(user)) initAdminIncidentsPage();
</script>
<style>.active-filter{background:var(--navy-950); color:#fff; border-color:var(--navy-950);}</style>
</body>
</html>
