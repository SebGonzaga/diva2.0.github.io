<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard — DIVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" />
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-shell-root"></div>

<template id="admin-content">
  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="diva-card reveal-on-scroll">
        <div class="card-eyebrow"><span>Total Users</span><i class="bi bi-people" style="color:var(--accent-cyan);"></i></div>
        <h3 class="card-num" data-count-to="1245">0</h3>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="diva-card reveal-on-scroll">
        <div class="card-eyebrow"><span>Active Alerts</span><i class="bi bi-bell" style="color:var(--status-warning);"></i></div>
        <h3 class="card-num" data-count-to="3">0</h3>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="diva-card reveal-on-scroll">
        <div class="card-eyebrow"><span>Incident Reports</span><i class="bi bi-flag" style="color:var(--status-critical);"></i></div>
        <h3 class="card-num" data-count-to="27">0</h3>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="diva-card reveal-on-scroll">
        <div class="card-eyebrow"><span>Volcanoes Monitored</span><i class="bi bi-triangle" style="color:var(--status-safe);"></i></div>
        <h3 class="card-num" data-count-to="6">0</h3>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-6">
      <div class="diva-card reveal-on-scroll">
        <div class="card-eyebrow"><span>User Registrations</span><span class="demo-data-tag">DEMO DATA</span></div>
        <canvas id="regChart" height="180"></canvas>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="diva-card reveal-on-scroll">
        <div class="card-eyebrow"><span>Chatbot Usage</span><span class="demo-data-tag">DEMO DATA</span></div>
        <canvas id="chatChart" height="180"></canvas>
      </div>
    </div>
  </div>

  <div class="diva-card reveal-on-scroll mt-4">
    <div class="card-eyebrow"><span>Backend integration status</span></div>
    <p class="text-muted-diva mb-0" style="font-size:.9rem;">This admin dashboard is currently a frontend prototype. User management, alert publishing, incident review, and analytics will connect to the PHP + MySQL backend (see spec §27–33) in the next build phase — each screen already reflects the required layout and permissions model.</p>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/main.js"></script>
<script>
  const user = renderAppShell("admin-dashboard.html", { title: "Admin Dashboard" });
  if (user) {
    document.getElementById("app-content").appendChild(document.getElementById("admin-content").content.cloneNode(true));
    initializeAnimations();

    new Chart(document.getElementById("regChart"), {
      type: "line",
      data: { labels: ["Mar","Apr","May","Jun","Jul","Aug"], datasets: [{ label: "New users", data: [80,140,190,260,340,1245], borderColor:"#33c9d1", backgroundColor:"rgba(51,201,209,.15)", fill:true, tension:.35 }] },
      options: { plugins: { legend: { display:false } } },
    });
    new Chart(document.getElementById("chatChart"), {
      type: "bar",
      data: { labels: ["Mar","Apr","May","Jun","Jul","Aug"], datasets: [{ label: "Conversations", data: [40,65,90,120,160,210], backgroundColor:"#2c5581", borderRadius:6 }] },
      options: { plugins: { legend: { display:false } } },
    });
  }
</script>
</body>
</html>
