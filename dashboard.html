<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — DIVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-shell-root"></div>

<template id="dashboard-content">
  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="diva-card reveal-on-scroll">
        <div class="card-eyebrow"><span>Weather</span><i class="bi bi-cloud-sun" style="color:var(--accent-cyan);"></i></div>
        <h3 class="card-num">31°C</h3>
        <span class="status-badge status-caution"><span class="dot"></span>Caution</span>
        <div class="data-source-line"><i class="bi bi-geo-alt"></i> Calamba, Laguna</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="diva-card reveal-on-scroll">
        <div class="card-eyebrow"><span>Volcano</span><i class="bi bi-triangle" style="color:var(--status-warning);"></i></div>
        <h3 class="card-num">AL 3</h3>
        <span class="status-badge status-warning"><span class="dot pulse-dot"></span>Mayon — Warning</span>
        <div class="data-source-line"><i class="bi bi-clock-history"></i> Updated 06:00</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="diva-card reveal-on-scroll">
        <div class="card-eyebrow"><span>Active alerts</span><i class="bi bi-bell" style="color:var(--status-critical);"></i></div>
        <h3 class="card-num" data-count-to="3">0</h3>
        <span class="status-badge status-critical"><span class="dot pulse-dot"></span>1 Critical</span>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="diva-card reveal-on-scroll">
        <div class="card-eyebrow"><span>Overall status</span><i class="bi bi-shield-check" style="color:var(--status-safe);"></i></div>
        <h3 class="card-num" style="font-size:1.4rem;">Stay Alert</h3>
        <span class="status-badge status-caution"><span class="dot"></span>Elevated</span>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-7">
      <div class="diva-card reveal-on-scroll mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 style="font-size:1.1rem; font-weight:700; color:var(--navy-950); margin:0;">Latest alerts</h2>
          <a href="alerts.html" class="text-decoration-none" style="font-size:.85rem; color:var(--accent-cyan); font-weight:600;">View all <i class="bi bi-arrow-right"></i></a>
        </div>
        <div class="d-flex flex-column gap-3" id="dashAlerts"></div>
      </div>

      <div class="diva-card reveal-on-scroll">
        <h2 style="font-size:1.1rem; font-weight:700; color:var(--navy-950); margin-bottom:1rem;">Emergency access</h2>
        <div class="row g-3">
          <div class="col-4"><a href="emergency.html" class="btn-diva btn-diva-ghost w-100 flex-column py-3" style="height:100%;" data-press><i class="bi bi-telephone fs-4 mb-1"></i><span style="font-size:.8rem;">Contacts</span></a></div>
          <div class="col-4"><a href="emergency.html#evac" class="btn-diva btn-diva-ghost w-100 flex-column py-3" style="height:100%;" data-press><i class="bi bi-signpost-split fs-4 mb-1"></i><span style="font-size:.8rem;">Evacuation</span></a></div>
          <div class="col-4"><a href="virtual-assistance.html" class="btn-diva btn-diva-ghost w-100 flex-column py-3" style="height:100%;" data-press><i class="bi bi-chat-dots fs-4 mb-1"></i><span style="font-size:.8rem;">Ask DIVA</span></a></div>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="diva-card reveal-on-scroll" style="background:linear-gradient(160deg, var(--navy-950), var(--navy-800)); border:none; color:#fff;">
        <div class="d-flex align-items-center gap-2 mb-3">
          <i class="bi bi-robot fs-4" style="color:var(--accent-cyan);"></i>
          <div>
            <div style="font-weight:700;">Quick AI Assistance</div>
            <div style="font-size:.78rem; color:rgba(255,255,255,.55);">Virtual Assistance</div>
          </div>
        </div>
        <p style="color:rgba(255,255,255,.7); font-size:.9rem;">Get calm, practical guidance on earthquakes, typhoons, floods, and eruptions — in English or Filipino.</p>
        <a href="virtual-assistance.html" class="btn-diva btn-diva-primary w-100 justify-content-center" data-press><i class="bi bi-chat-dots"></i> Ask DIVA</a>
      </div>

      <div class="diva-card reveal-on-scroll mt-4">
        <h2 style="font-size:1.1rem; font-weight:700; color:var(--navy-950); margin-bottom:1rem;">Volcano watch</h2>
        <div class="d-flex flex-column gap-3" id="dashVolcanoes"></div>
        <a href="volcano.html" class="btn-diva btn-diva-ghost w-100 justify-content-center mt-3" data-press>View volcano monitoring</a>
      </div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  const user = renderAppShell("dashboard.html", { title: "Dashboard" });
  if (user) {
    document.getElementById("app-content").appendChild(document.getElementById("dashboard-content").content.cloneNode(true));

    const severityMap = { information: "level-info", advisory: "level-advisory", warning: "level-warning", critical: "level-critical" };
    const statusMap = { information: "status-safe", advisory: "status-caution", warning: "status-warning", critical: "status-critical" };
    const alertsHost = document.getElementById("dashAlerts");
    DIVA_DEMO.alerts.slice(0, 3).forEach((a) => {
      const div = document.createElement("div");
      div.className = `alert-banner ${severityMap[a.severity]} reveal-on-scroll`;
      div.innerHTML = `<i class="bi bi-exclamation-triangle icon"></i>
        <div>
          <div class="d-flex align-items-center gap-2 mb-1">
            <strong>${a.title}</strong>
            <span class="status-badge ${statusMap[a.severity]}" style="font-size:.62rem;">${a.severity}</span>
          </div>
          <div style="font-size:.85rem;">${a.message}</div>
          <div class="data-source-line" style="margin-top:.4rem;"><i class="bi bi-geo"></i> ${a.area}</div>
        </div>`;
      alertsHost.appendChild(div);
    });

    const volcHost = document.getElementById("dashVolcanoes");
    const levelColor = (l) => (l === 0 ? "status-safe" : l <= 1 ? "status-caution" : l <= 3 ? "status-warning" : "status-critical");
    DIVA_DEMO.volcanoes.slice(0, 3).forEach((v) => {
      const div = document.createElement("div");
      div.className = "d-flex justify-content-between align-items-center";
      div.innerHTML = `<div>
          <div style="font-weight:600; font-size:.9rem; color:var(--navy-950);">${v.name}</div>
          <div style="font-size:.78rem; color:var(--ink-400);">${v.location}</div>
        </div>
        <span class="status-badge ${levelColor(v.level)}"><span class="dot ${v.level > 0 ? "pulse-dot" : ""}"></span>AL ${v.level}</span>`;
      volcHost.appendChild(div);
    });

    initializeAnimations();
  }
</script>
</body>
</html>
