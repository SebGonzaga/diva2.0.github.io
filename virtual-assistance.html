<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("diva_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Virtual Assistance — DIVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-shell-root"></div>

<template id="va-content">
  <div class="chat-shell reveal-on-scroll">
    <div class="chat-header">
      <div>
        <div style="font-weight:700; color:var(--navy-950);"><i class="bi bi-robot dicon" style="color:var(--accent-cyan);" data-dicon="robot"></i> Virtual Assistance</div>
        <div style="font-size:.78rem; color:var(--ink-400);">General disaster guidance — not a substitute for emergency services</div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="lang-toggle">
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="fil">FIL</button>
        </div>
        <button class="btn-diva btn-diva-ghost btn-diva-sm" id="clearChatBtn" data-press><i class="bi bi-trash3 dicon" data-dicon="trash3"></i> Clear Chat</button>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <form class="chat-input-row" id="chatForm">
      <input type="text" id="chatInput" placeholder="Ask about earthquakes, typhoons, floods, eruptions…" autocomplete="off">
      <button type="submit" class="chat-send-btn" aria-label="Send message"><i class="bi bi-send dicon" data-dicon="send"></i></button>
    </form>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/diva-auth.js"></script>
<script src="assets/js/main.js"></script>
<script type="module">
  await DivaAuth.init();
  const user = renderAppShell("virtual-assistance.html", { title: "Virtual Assistance" });
  let currentLang = "en";
  const STORAGE_KEY = "diva_chat_" + (user ? user.email : "guest");

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveHistory(history) { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); }

  function emptyStateHtml() {
    return `<div class="empty-state" id="chatEmptyState" style="padding-top:1.5rem;">
      <div class="glyph"><i class="bi bi-robot dicon" style="color:var(--accent-cyan);" data-dicon="robot"></i></div>
      <div style="font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--navy-950);">How can I help you today?</div>
      <div class="va-topic-grid">
        <button type="button" class="va-topic-btn" data-topic="What is the current weather risk?"><i class="bi bi-cloud-sun dicon" data-dicon="cloud-sun"></i> Weather</button>
        <button type="button" class="va-topic-btn" data-topic="Volcanic eruption signs?"><i class="bi bi-triangle dicon" data-dicon="triangle"></i> Volcano</button>
        <button type="button" class="va-topic-btn" data-topic="How do I prepare an emergency kit?"><i class="bi bi-house dicon" data-dicon="house"></i> Prepare</button>
        <button type="button" class="va-topic-btn" data-topic="What should I do in an emergency?"><i class="bi bi-exclamation-triangle dicon" data-dicon="exclamation-triangle"></i> Emergency</button>
      </div>
    </div>`;
  }

  function appendMessage(role, text, animate) {
    const host = document.getElementById("chatMessages");
    const empty = document.getElementById("chatEmptyState");
    if (empty) empty.remove();
    const el = document.createElement("div");
    el.className = `chat-msg ${role}`;
    el.innerHTML = `<div class="chat-avatar ${role}">${role === "user" ? "You" : "AI"}</div><div class="bubble">${text}</div>`;
    host.appendChild(el);
    if (animate) DivaAnim.animateChatMessage(el, role);
    host.scrollTop = host.scrollHeight;
    return el;
  }

  function classifyPrompt(text) {
    const t = text.toLowerCase();
    if (t.includes("earthquake") || t.includes("lindol")) return "earthquake";
    if (t.includes("flood") || t.includes("baha")) return "flood";
    if (t.includes("typhoon") || t.includes("bagyo") || t.includes("weather") || t.includes("panahon") || t.includes("prepare") || t.includes("kit") || t.includes("hakbang")) return "typhoon";
    if (t.includes("volcan") || t.includes("bulkan") || t.includes("eruption") || t.includes("ashfall")) return "volcano";
    if (t.includes("contact") || t.includes("emergency number") || t.includes("numero")) return "contacts";
    return "default";
  }

  // Some questions ask for live numbers the chatbot has no way to know —
  // how many incidents/alerts are near the user right now, today's actual
  // weather, the nearest recent earthquake. Rather than let the AI guess or
  // make something up, these route straight to the DIVA page that already
  // shows that data live (Supabase-backed maps, the weather API proxy, the
  // USGS earthquake feed). Checked before the AI call — no tokens spent,
  // and it works even if the AI/backend is down.
  const DATA_INTENT_REPLIES = {
    en: {
      incidents: { icon: "bi-geo-alt", heading: "Live incident map", intro: "I can't count incidents from here, but the Situation Map plots every resident-reported incident near you in real time.", cta: { label: "Open incident map", href: "dashboard.html?focus=incidents" } },
      alerts: { icon: "bi-megaphone", heading: "Active alerts", intro: "I don't have live alert counts in this chat, but the Alerts page lists everything currently active for your area.", cta: { label: "View active alerts", href: "alerts.html" } },
      weather: { icon: "bi-cloud-sun", heading: "Current weather", intro: "I can't pull today's actual conditions into chat, but the Weather page shows live conditions and the forecast for your location.", cta: { label: "Check the weather", href: "weather.html" } },
      earthquake: { icon: "bi-activity", heading: "Latest earthquake data", intro: "I don't have live seismic data here, but the Earthquake page tracks the most recent quakes near the Philippines, including distance and magnitude.", cta: { label: "View recent earthquakes", href: "earthquake.html" } },
      shelters: { icon: "bi-house-heart", heading: "Nearby evacuation centers", intro: "For the closest evacuation centers and their live status, the Situation Map has you covered.", cta: { label: "Find evacuation centers", href: "dashboard.html?focus=shelters" } },
      volcano: { icon: "bi-triangle", heading: "Taal Volcano status", intro: "For the current PHIVOLCS-style alert level and monitoring details, check the Volcano page.", cta: { label: "View volcano monitoring", href: "volcano.html" } },
    },
    fil: {
      incidents: { icon: "bi-geo-alt", heading: "Live na mapa ng insidente", intro: "Hindi ko mabibilang ang mga insidente dito, pero ipinapakita ng Situation Map ang lahat ng iniulat na insidente malapit sa iyo, real-time.", cta: { label: "Buksan ang mapa ng insidente", href: "dashboard.html?focus=incidents" } },
      alerts: { icon: "bi-megaphone", heading: "Mga aktibong alerto", intro: "Wala akong live na bilang ng alerto dito, pero nakalista sa Alerts page ang lahat ng kasalukuyang aktibo sa inyong lugar.", cta: { label: "Tingnan ang mga alerto", href: "alerts.html" } },
      weather: { icon: "bi-cloud-sun", heading: "Kasalukuyang panahon", intro: "Hindi ko makuha ang aktwal na kondisyon ngayon dito, pero ipinapakita ng Weather page ang live na kondisyon at forecast para sa inyong lokasyon.", cta: { label: "Tingnan ang panahon", href: "weather.html" } },
      earthquake: { icon: "bi-activity", heading: "Pinakabagong datos ng lindol", intro: "Wala akong live na datos ng lindol dito, pero sinusubaybayan ng Earthquake page ang mga pinakabagong lindol malapit sa Pilipinas, kasama ang distansya at magnitude.", cta: { label: "Tingnan ang mga lindol", href: "earthquake.html" } },
      shelters: { icon: "bi-house-heart", heading: "Pinakamalapit na evacuation center", intro: "Para sa pinakamalapit na evacuation center at kanilang status, tingnan ang Situation Map.", cta: { label: "Hanapin ang evacuation center", href: "dashboard.html?focus=shelters" } },
      volcano: { icon: "bi-triangle", heading: "Status ng Bulkang Taal", intro: "Para sa kasalukuyang alert level at detalye ng monitoring, tingnan ang Volcano page.", cta: { label: "Tingnan ang volcano monitoring", href: "volcano.html" } },
    },
  };

  function detectDataIntent(text) {
    const t = text.toLowerCase();
    const near = /(near me|nearby|malapit)/.test(t);
    const howMany = /how many|ilan/.test(t);
    if (/taal|bulkang taal/.test(t) && /(status|alert level|update)/.test(t)) return "volcano";
    if (/incident/.test(t) && (near || howMany || /report/.test(t))) return "incidents";
    if (/(evacuation center|shelter|paglikas)/.test(t)) return "shelters";
    if (/\balert/.test(t) && !/alert level/.test(t) && (near || howMany || /active/.test(t) || /babala/.test(t))) return "alerts";
    if (/(epicenter|earthquake|lindol|quake)/.test(t) && (near || /nearest|latest|recent|last|newest/.test(t))) return "earthquake";
    if (/(weather|panahon|ulan)/.test(t) && /(today|now|current|currently|ngayon|right now)/.test(t)) return "weather";
    return null;
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    const history = loadHistory();
    appendMessage("user", text, true);
    history.push({ role: "user", message: text });
    saveHistory(history);
    document.getElementById("chatInput").value = "";

    const host = document.getElementById("chatMessages");
    const typingEl = document.createElement("div");
    typingEl.className = "chat-msg assistant";
    typingEl.innerHTML = `<div class="chat-avatar assistant">AI</div><div class="bubble typing-dots"><span></span><span></span><span></span></div>`;
    host.appendChild(typingEl);
    host.scrollTop = host.scrollHeight;
    const dotsHandle = DivaAnim.startTypingDots(typingEl.querySelector(".typing-dots"));

    // If this looks like a request for live data (incidents/alerts/weather/
    // quakes near the user), skip the AI call entirely and point them at
    // the DIVA page that actually has that data. Deterministic and free —
    // see detectDataIntent() above.
    const dataIntent = detectDataIntent(text);
    let reply;
    if (dataIntent) {
      reply = divaQuickLinkReply({ tone: "info", ...DATA_INTENT_REPLIES[currentLang][dataIntent] });
      DivaAnim.stopTypingDots(dotsHandle);
      typingEl.remove();
      appendMessage("assistant", reply, true);
      history.push({ role: "assistant", message: reply });
      saveHistory(history);
      if (user) {
        const { error: logError } = await sb.from("chat_logs").insert({ user_id: user.id });
        if (logError) console.error("Chat log error:", logError);
      }
      return;
    }

    // Calls /api/chat.js, which proxies Gemini server-side so the API key
    // never touches the browser. Falls back to a canned demo reply if the
    // request fails (e.g. GEMINI_API_KEY not configured yet in Vercel).
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          lang: currentLang,
          history: history.slice(-10).map((m) => ({ role: m.role, content: m.message })),
        }),
      });
      if (!res.ok) throw new Error("chat request failed: " + res.status);
      const data = await res.json();
      reply = data.reply;
      if (!reply) throw new Error("empty reply from /api/chat");
    } catch (err) {
      console.error("Live chat unavailable, falling back to demo reply:", err);
      const category = classifyPrompt(text);
      reply = DIVA_DEMO.aiReplies[currentLang][category];
    }

    DivaAnim.stopTypingDots(dotsHandle);
    typingEl.remove();
    appendMessage("assistant", reply, true);
    history.push({ role: "assistant", message: reply });
    saveHistory(history);

    // Minimal usage log (who + when only, never the message content) so
    // the admin dashboard's "Chatbot Usage" chart reflects real activity
    // instead of a hardcoded array. See supabase/004_*.sql.
    if (user) {
      const { error: logError } = await sb.from("chat_logs").insert({ user_id: user.id });
      if (logError) console.error("Chat log error:", logError);
    }
  }

  function initVaPage() {
    document.getElementById("app-content").appendChild(document.getElementById("va-content").content.cloneNode(true));
    initializeAnimations();

    const host = document.getElementById("chatMessages");
    const history = loadHistory();
    if (!history.length) {
      host.innerHTML = emptyStateHtml();
    } else {
      history.forEach((m) => appendMessage(m.role, m.message, false));
    }

    // Event delegation: quick-topic buttons only exist in the empty state,
    // which is re-rendered after "Clear Chat", so bind on the container.
    // Clicking any one of them sends that message immediately, which removes
    // the empty state (and the topics with it) — they only ever show once.
    host.addEventListener("click", (e) => {
      const btn = e.target.closest(".va-topic-btn");
      if (btn) sendMessage(btn.dataset.topic);
    });

    document.querySelectorAll(".lang-toggle button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".lang-toggle button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        currentLang = b.dataset.lang;
      });
    });

    document.getElementById("chatForm").addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(document.getElementById("chatInput").value);
    });

    document.getElementById("clearChatBtn").addEventListener("click", () => {
      const msgs = Array.from(host.querySelectorAll(".chat-msg"));
      if (!msgs.length) return;
      let remaining = msgs.length;
      msgs.forEach((m, i) => {
        setTimeout(() => {
          if (window.anime) {
            anime.animate(m, { opacity: [1, 0], translateY: [0, -8], duration: 220, easing: "easeInQuad", onComplete: () => {
              m.remove();
              remaining--;
              if (remaining === 0) { host.innerHTML = emptyStateHtml(); saveHistory([]); }
            }});
          } else {
            m.remove(); remaining--;
            if (remaining === 0) { host.innerHTML = emptyStateHtml(); saveHistory([]); }
          }
        }, i * 60);
      });
      divaToast("Chat cleared", "bi-trash3");
    });
  }

  if (user) initVaPage();
</script>
</body>
</html>
