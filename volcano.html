<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("rain_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taal Volcano — RAIN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/volcano.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1830">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>
<div id="app-shell-root"></div>

<template id="volcano-content">
<div class="vo-page">
  <section class="vo-hero reveal-on-scroll" id="voHero">
    <div id="voEmbers"></div>
    <div class="vo-hero-row">
      <div>
        <span class="vo-kicker"><i class="bi bi-fire"></i> Volcano monitoring</span>
        <h1>Taal Volcano</h1>
        <div class="vo-sub">Talisay / San Nicolas, Batangas, Philippines</div>
        <div class="vo-chips">
          <span class="vo-chip"><span>Coordinates</span><b id="tvCoords">—</b></span>
          <span class="vo-chip"><span>Elevation</span><b id="tvElev">—</b></span>
          <span class="vo-chip"><span>GVP #</span><b>273070</b></span>
          <span class="vo-chip"><span>Aviation</span><i class="vo-av" id="tvAvDot"></i><b id="tvColor">—</b></span>
        </div>
        <div class="vo-sub mt-3" style="font-size:.76rem" id="tvSourceLine">Loading live data from USGS VolcView…</div>
      </div>
      <div class="text-center">
        <div class="vo-gauge" id="voGauge" role="img" aria-label="PHIVOLCS alert level">
          <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="voArc" cx="60" cy="60" r="54"/></svg>
          <div class="vo-gauge-in"><small>Alert level</small><b id="voLvl">–</b></div>
        </div>
        <div class="vo-lvl-name" id="voLvlName">Not entered yet</div>
        <div class="vo-sub" style="font-size:.72rem" id="voAsOf">PHIVOLCS bulletin</div>
      </div>
    </div>
  </section>

  <div class="rain-card reveal-on-scroll mb-4" id="vsCard">
    <div class="card-eyebrow"><span>Official PHIVOLCS bulletin (copied by RAIN administrators)</span><span class="demo-data-tag" style="background:#0f766e">OFFICIAL SOURCE · HUMAN-ENTERED</span></div>
    <div class="vo-ladder" id="voLadder"></div>
    <div id="vsBody" style="font-size:.87rem;">Loading…</div>
    <div class="text-muted-rain mt-2" style="font-size:.78rem;">PHIVOLCS does not offer a public data feed this app can read, so an administrator copies the current alert level here. The official PHIVOLCS bulletin and instructions always take priority over this page.</div>
    <div class="data-source-line"><i class="bi bi-box-arrow-up-right dicon" data-dicon="box-arrow-up-right"></i> <a href="https://www.phivolcs.dost.gov.ph/" target="_blank" rel="noopener">Check the current advisory at phivolcs.dost.gov.ph &rarr;</a></div>
    <details class="vo-admin mt-3 d-none" id="vsAdmin">
      <summary><i class="bi bi-chevron-right"></i> Admin: enter the current PHIVOLCS bulletin</summary>
      <form id="vsForm" class="row g-2 mt-2" style="font-size:.82rem;" autocomplete="off">
        <div class="col-6 col-md-3"><label class="form-label mb-0">Alert level (0-5) *</label><input type="number" min="0" max="5" step="1" class="form-control form-control-sm" id="vsLevel" required></div>
        <div class="col-6 col-md-4"><label class="form-label mb-0">Bulletin issued (as printed) *</label><input type="datetime-local" class="form-control form-control-sm" id="vsIssued" required></div>
        <div class="col-12 col-md-5"><label class="form-label mb-0">Bulletin link (https) *</label><input type="url" class="form-control form-control-sm" id="vsUrl" required maxlength="500" placeholder="https://www.phivolcs.dost.gov.ph/..."></div>
        <div class="col-12"><label class="form-label mb-0">Headline (as printed)</label><input class="form-control form-control-sm" id="vsHead" maxlength="200"></div>
        <div class="col-12"><label class="form-label mb-0">Short summary</label><textarea class="form-control form-control-sm" id="vsSum" rows="2" maxlength="2000"></textarea></div>
        <div class="col-12 d-flex gap-2 align-items-center"><button class="btn-rain btn-rain-primary btn-rain-sm" type="submit">Publish</button><button class="btn-rain btn-rain-ghost btn-rain-sm d-none" type="button" id="vsDelete">Delete shown entry</button><span id="vsMsg" class="text-muted"></span></div>
      </form>
    </details>
  </div>

  <div class="rain-card mb-4" id="aiDigestVolcano" style="font-size:.85rem;"></div>

  <div class="row g-4 mb-4">
    <div class="col-lg-5">
      <div class="rain-card reveal-on-scroll h-100">
        <div class="card-eyebrow"><span>Conditions at Taal</span><span class="demo-data-tag" style="background:var(--accent-cyan); color:#fff;">LIVE</span></div>
        <div id="wxLoading" style="padding:.25rem 0;">
          <span class="skeleton d-block mb-3" style="width:50%; height:2.2rem;"></span>
          <span class="skeleton d-block mb-3" style="width:60%; height:16px;"></span>
          <div class="row g-2"><div class="col-6"><span class="skeleton d-block" style="height:32px;"></span></div><div class="col-6"><span class="skeleton d-block" style="height:32px;"></span></div></div>
        </div>
        <div id="wxError" class="error-state d-none" style="padding:1.5rem 0;">
          <div class="glyph"><i class="bi bi-exclamation-octagon dicon" data-dicon="exclamation-octagon"></i></div>
          <div><strong>Unable to retrieve weather data.</strong></div>
          <button class="btn-rain btn-rain-ghost btn-rain-sm mt-3" id="wxRetry">Retry</button>
        </div>
        <div id="wxBody" class="d-none">
          <div class="d-flex justify-content-between align-items-center gap-2">
            <div>
              <h3 class="card-num" id="wTemp" style="font-size:2.6rem;">—</h3>
              <div class="d-flex align-items-center gap-2 mb-3"><i class="bi bi-cloud-sun fs-3" style="color:var(--accent-cyan);" id="wIcon"></i><span id="wCondition" style="font-weight:600; color:var(--navy-950);">—</span></div>
            </div>
            <div class="vo-compass" title="Direction the wind is blowing toward">
              <svg viewBox="0 0 100 100"><circle class="ring" cx="50" cy="50" r="40"/><text x="50" y="12">N</text><text x="91" y="53">E</text><text x="50" y="94">S</text><text x="9" y="53">W</text>
                <g class="vo-arrow" id="wArrow"><path d="M50 22 L58 50 L50 45 L42 50 Z" fill="#f97316"/><path d="M50 78 L50 45" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/></g></svg>
            </div>
          </div>
          <div class="row g-2" style="font-size:.85rem;">
            <div class="col-6"><span class="text-muted-rain">Feels like</span><div style="font-weight:600;" id="wFeels">—</div></div>
            <div class="col-6"><span class="text-muted-rain">Humidity</span><div style="font-weight:600;" id="wHumidity">—</div></div>
            <div class="col-6"><span class="text-muted-rain">Wind</span><div style="font-weight:600;" id="wWind">—</div></div>
            <div class="col-6"><span class="text-muted-rain">Visibility</span><div style="font-weight:600;" id="wVisibility">—</div></div>
          </div>
          <p class="text-muted-rain mt-2" style="font-size:.78rem;">The arrow points where the wind is blowing toward. That is context for possible ash/gas drift, not a hazard forecast. Always follow official PHIVOLCS advisories.</p>
          <div class="data-source-line" id="wxSourceLine"><i class="bi bi-clock-history"></i> Source: OpenWeatherMap</div>
        </div>
      </div>
    </div>
    <div class="col-lg-7">
      <div class="rain-card reveal-on-scroll h-100">
        <div class="card-eyebrow"><span>Location Map</span><span class="demo-data-tag" style="background:var(--accent-cyan); color:#fff;">LIVE</span></div>
        <div class="vo-map"><div id="volcano-map" style="height:100%"></div></div>
      </div>
    </div>
  </div>

  <div class="rain-card reveal-on-scroll">
    <div class="card-eyebrow"><span>About Taal</span><i class="bi bi-info-circle dicon" style="color:var(--accent-cyan);" data-dicon="info-circle"></i></div>
    <p style="font-size:.87rem; color:var(--ink-600);">
      Taal is a caldera roughly 15 by 20 km wide in southwestern Luzon, largely filled by Lake Taal. Its low-lying Volcano
      Island, near sea level at the lake's center, is where all of its historical eruptions have originated, and it has a long
      record of powerful, sometimes deadly, eruptions. Because the caldera sits so close to the surrounding lake and its
      vents are shallow, it's especially prone to abrupt phreatic and phreatomagmatic explosions.
    </p>
    <div class="data-source-line"><i class="bi bi-box-arrow-up-right dicon" data-dicon="box-arrow-up-right"></i> <a id="tvGvpLink" href="https://volcano.si.edu/volcano.cfm?vn=273070" target="_blank" rel="noopener">View Taal's full profile and latest activity report (Smithsonian GVP) &rarr;</a></div>
  </div>
</div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/rain-auth.js"></script>
<script src="assets/js/offline-store.js"></script>
<script src="assets/js/ai-digest-card.js"></script>
<script src="assets/js/main.js"></script>
<script type="module">
  await RainAuth.init();
  // CARTO Basemaps API key (meant to ship in client code, like a Mapbox token).
  const CARTO_API_KEY = "cb1_3qde_1_313d908e961a073e7e5de450";
  const user = renderAppShell("volcano.html", { title: "Taal Volcano" });
  const $ = (id) => document.getElementById(id);
  const TAAL_VNUM = "273070";
  const TAAL_FALLBACK = { lat: 14.0021, lng: 120.9932, elevM: 311 };
  const AVIATION = { GREEN: ["Green (normal)", "#22c55e"], YELLOW: ["Yellow (advisory)", "#eab308"], ORANGE: ["Orange (watch)", "#f97316"], RED: ["Red (warning)", "#ef4444"] };
  const ICON_MAP = { "01d": "bi-sun", "01n": "bi-moon-stars", "02d": "bi-cloud-sun", "02n": "bi-cloud-moon", "03d": "bi-cloud", "03n": "bi-cloud", "04d": "bi-clouds", "04n": "bi-clouds", "09d": "bi-cloud-drizzle", "09n": "bi-cloud-drizzle", "10d": "bi-cloud-rain", "10n": "bi-cloud-rain", "11d": "bi-cloud-lightning", "11n": "bi-cloud-lightning", "13d": "bi-snow", "13n": "bi-snow", "50d": "bi-cloud-haze", "50n": "bi-cloud-haze" };
  const compass = (deg) => ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"][Math.round(deg / 22.5) % 16];
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // PHIVOLCS 0-5 scale (names as in RAINtanauan). Colours are display only.
  const LEVEL_NAMES = { 0: "Normal", 1: "Low-level unrest", 2: "Moderate level of unrest", 3: "Magmatic unrest", 4: "Hazardous eruption imminent", 5: "Hazardous eruption in progress" };
  const LV_COL = ["#22c55e", "#eab308", "#f59e0b", "#f97316", "#ef4444", "#b91c1c"];
  const fmtPHT = (t) => new Date(t).toLocaleString("en-PH", { timeZone: "Asia/Manila", month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }) + " PHT";
  const ago = (t) => { const m = Math.max(0, Math.round((Date.now() - new Date(t)) / 6e4)); return m < 60 ? m + " min ago" : m < 2880 ? Math.round(m / 60) + " h ago" : Math.floor(m / 1440) + " days ago"; };

  function paintHero(lvl, name, asOf) {
    const col = lvl == null ? "#64748b" : LV_COL[lvl];
    $("voHero").style.setProperty("--vo-c", col);
    $("voLvl").textContent = lvl == null ? "–" : lvl; $("voLvlName").textContent = name; $("voAsOf").textContent = asOf;
    setTimeout(() => { $("voArc").style.strokeDashoffset = 339.3 * (1 - (lvl == null ? 0 : Math.max(lvl, 0.15) / 5)); }, 120);
    document.querySelectorAll(".vo-step").forEach((s) => s.classList.toggle("on", lvl != null && +s.dataset.l === lvl));
  }

  // ---------- PHIVOLCS bulletin (admin-entered, supabase/009_volcano_status.sql) ----------
  let shownId = null;
  async function loadBulletin() {
    const body = $("vsBody"); shownId = null; $("vsDelete").classList.add("d-none");
    const { data, error } = await sb.from("volcano_status").select("*").eq("volcano", "Taal").order("bulletin_issued_at", { ascending: false }).limit(1);
    if (error) { console.warn("volcano_status", error); body.textContent = "Could not load the alert level (the volcano_status table may not be set up yet). Check PHIVOLCS directly."; paintHero(null, "Unavailable", "Check PHIVOLCS directly"); return; }
    if (!data.length) {
      body.innerHTML = "No alert level has been entered by an administrator yet. <b>Check PHIVOLCS directly for the current level.</b>";
      try {   // fall back to the level copied by the nightly job (ai_digests.metrics), clearly labelled
        const r = await sb.from("ai_digests").select("alert_level,metrics,digest_date").eq("kind", "volcano").order("created_at", { ascending: false }).limit(5);
        const d = (r.data || []).find((x) => (x.metrics && x.metrics.alert_level != null) || x.alert_level != null);
        const lv = d ? (d.metrics && d.metrics.alert_level != null ? d.metrics.alert_level : d.alert_level) : null;
        if (lv != null) { paintHero(lv, LEVEL_NAMES[lv] || "", "Auto-copied from bulletin" + (d.metrics && d.metrics.bulletin_date ? " of " + d.metrics.bulletin_date : "")); return; }
      } catch (e) { console.warn("digest fallback", e); }
      paintHero(null, "Not entered yet", "Check PHIVOLCS directly"); return;
    }
    const v = data[0]; shownId = v.id;
    if (RainAuth.isAdmin(RainAuth.getUser())) $("vsDelete").classList.remove("d-none");
    const ageD = (Date.now() - new Date(v.bulletin_issued_at).getTime()) / 864e5, safe = /^https:\/\//.test(v.source_url) ? v.source_url : null;
    paintHero(v.alert_level, LEVEL_NAMES[v.alert_level] || "", "Bulletin " + ago(v.bulletin_issued_at));
    body.innerHTML = (ageD > 3 ? `<div class="vo-stale"><i class="bi bi-hourglass-split"></i><span>This bulletin is ${Math.floor(ageD)} days old. PHIVOLCS may have issued a newer one; check the official site.</span></div>` : "") +
      `<div class="d-flex flex-wrap align-items-center gap-2 mb-1"><span class="vo-asof"><i class="bi bi-clock"></i> Issued ${esc(fmtPHT(v.bulletin_issued_at))}</span><span class="vo-asof">Level ${esc(v.alert_level)} · ${esc(LEVEL_NAMES[v.alert_level] || "")}</span></div>` +
      (v.headline ? `<div class="vo-head mt-2">${esc(v.headline)}</div>` : "") + (v.summary ? `<p class="mt-1 mb-2">${esc(v.summary)}</p>` : "") +
      `<div style="font-size:.78rem;">` + (safe ? `<a href="${esc(safe)}" target="_blank" rel="noopener noreferrer">Open the PHIVOLCS bulletin &rarr;</a>` : "No valid source link") + ` &middot; Level names follow PHIVOLCS' 0&ndash;5 scale.</div>`;
  }
  function initAdminForm() {
    if (!RainAuth.isAdmin(RainAuth.getUser())) return;
    $("vsAdmin").classList.remove("d-none");
    const f = $("vsForm"), msg = $("vsMsg"), g = (id) => $(id).value.trim();
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const issued = new Date($("vsIssued").value), lvl = Number(g("vsLevel"));
      if (!Number.isInteger(lvl) || lvl < 0 || lvl > 5 || isNaN(issued)) { msg.textContent = "Check the level (0-5) and issue time."; return; }
      if (!/^https:\/\//.test(g("vsUrl"))) { msg.textContent = "Link must start with https://"; return; }
      const { data: au } = await sb.auth.getUser();
      const { error } = await sb.from("volcano_status").insert({ created_by: au && au.user ? au.user.id : null, volcano: "Taal", alert_level: lvl, bulletin_issued_at: issued.toISOString(), headline: g("vsHead") || null, summary: g("vsSum") || null, source_url: g("vsUrl") });
      if (error) { console.error(error); msg.textContent = "Could not save: " + error.message; return; }
      msg.textContent = "Published."; f.reset(); loadBulletin();
    });
    $("vsDelete").addEventListener("click", async () => {
      if (!shownId || !confirm("Delete the alert-level entry currently shown?")) return;
      const { error } = await sb.from("volcano_status").delete().eq("id", shownId);
      if (error) { rainToast("Could not delete", "bi-exclamation-triangle"); return; }
      loadBulletin();
    });
  }

  // ---------- location (USGS VolcView) + map ----------
  async function loadLocation() {
    let loc, live = true;
    try {
      const res = await fetch("https://volcview.wr.usgs.gov/vv-api/volcanoApi/wwvolcanoes"); if (!res.ok) throw new Error(res.status);
      loc = (await res.json()).find((x) => String(x.vnum) === TAAL_VNUM); if (!loc) throw new Error("Taal not found");
    } catch (err) { console.warn("Live Taal location fetch failed, using fallback.", err); loc = TAAL_FALLBACK; live = false; }
    $("tvCoords").textContent = `${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}`; $("tvElev").textContent = `${loc.elevM} m`;
    const av = loc.color && AVIATION[String(loc.color).toUpperCase()];
    $("tvColor").textContent = av ? av[0] : loc.color || "None on file"; $("voHero").style.setProperty("--av", av ? av[1] : "#64748b"); $("tvAvDot").style.setProperty("--vo-c", av ? av[1] : "#64748b");
    if (live) RainOffline.save("taalLocation", loc);
    const saved = RainOffline.load("taalLocation");
    $("tvSourceLine").innerHTML = live ? "Live from USGS VolcView (worldwide volcanoes API), fetched just now." : `USGS VolcView was unreachable — showing ${saved ? "coordinates saved " + RainOffline.timeAgo(saved.savedAt) : "fallback coordinates"} instead.`;
    const map = L.map("volcano-map", { scrollWheelZoom: false }).setView([loc.lat, loc.lng], 12);
    const street = L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`, { attribution: '&copy; OpenStreetMap contributors &copy; CARTO', maxZoom: 19 }).addTo(map);
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics", maxZoom: 19 });
    L.control.layers({ Street: street, Satellite: sat }, null, { position: "topright" }).addTo(map);
    L.marker([loc.lat, loc.lng], { icon: L.divIcon({ className: "", html: '<div class="vo-pin"><i class="bi bi-fire"></i></div>', iconSize: [34, 34], iconAnchor: [17, 17] }) }).addTo(map).bindPopup("<strong>Taal Volcano</strong><br>Volcano Island, Lake Taal");
    setTimeout(() => map.invalidateSize(), 200);
    return loc;
  }

  // ---------- weather ----------
  function showWx(w) {
    $("wTemp").textContent = `${w.tempC}°C`; $("wCondition").textContent = w.condition.replace(/\b\w/g, (c) => c.toUpperCase()); $("wIcon").className = `bi ${w.icon || "bi-cloud"} fs-3`;
    $("wFeels").textContent = `${w.feelsC}°C`; $("wHumidity").textContent = `${w.humidity}%`; $("wWind").textContent = `${w.windKmh} km/h ${w.windDir || ""}`.trim();
    $("wVisibility").textContent = w.visibilityKm != null ? `${w.visibilityKm} km` : "—";
    $("wxLoading").classList.add("d-none"); $("wxError").classList.add("d-none"); $("wxBody").classList.remove("d-none");
    if (w.deg != null) setTimeout(() => { $("wArrow").style.transform = `rotate(${(w.deg + 180) % 360}deg)`; }, 150);   // arrow = direction wind blows TOWARD
  }
  async function loadWeather(lat, lng) {
    $("wxLoading").classList.remove("d-none"); $("wxBody").classList.add("d-none"); $("wxError").classList.add("d-none");
    try {
      const res = await fetch(`/api/weather?lat=${lat}&lng=${lng}`); if (!res.ok) throw new Error(res.status);
      const c = await res.json(), windKmh = Math.round(c.wind.speed * 3.6);
      const w = { tempC: Math.round(c.main.temp), condition: c.weather[0].description, icon: ICON_MAP[c.weather[0].icon], feelsC: Math.round(c.main.feels_like), humidity: c.main.humidity, windKmh, deg: c.wind.deg, windDir: c.wind.deg != null ? compass(c.wind.deg) : "", visibilityKm: c.visibility != null ? (c.visibility / 1000).toFixed(1) : null };
      showWx(w); $("wxSourceLine").innerHTML = `<i class="bi bi-clock-history"></i> Updated ${new Date(c.dt * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} · Source: OpenWeatherMap`;
      RainOffline.save("taalWeather", w);
    } catch (err) {
      console.error(err); const cached = RainOffline.load("taalWeather");
      if (cached && !RainOffline.isOnline()) { showWx(cached.data); $("wxSourceLine").innerHTML = `<span class="cached-data-tag"><i class="bi bi-cloud-slash"></i> Saved data</span> Offline — showing reading saved ${RainOffline.timeAgo(cached.savedAt)}.`; }
      else { $("wxLoading").classList.add("d-none"); $("wxError").classList.remove("d-none"); }
    }
  }

  async function initVolcanoPage() {
    $("app-content").appendChild($("volcano-content").content.cloneNode(true));
    $("voEmbers").innerHTML = Array.from({ length: 16 }, () => `<i class="vo-ember" style="--x:${(Math.random() * 100).toFixed(1)}%;--s:${(2 + Math.random() * 4).toFixed(1)}px;--d:${(5 + Math.random() * 6).toFixed(1)}s;--t:${(Math.random() * 6).toFixed(1)}s;--dx:${(Math.random() * 90 - 45).toFixed(0)}px"></i>`).join("");
    $("voLadder").innerHTML = Object.entries(LEVEL_NAMES).map(([l, n]) => `<div class="vo-step" data-l="${l}" style="--sc:${LV_COL[l]}"><b>${l}</b>${esc(n)}</div>`).join("");
    $("wxRetry").addEventListener("click", () => { const loc = window.__taalLoc || TAAL_FALLBACK; loadWeather(loc.lat, loc.lng); });
    initializeAnimations(); initAdminForm(); loadBulletin();
    const loc = await loadLocation(); window.__taalLoc = loc; await loadWeather(loc.lat, loc.lng);
  }
  if (user) initVolcanoPage();
  RainDigest.mount("aiDigestVolcano", "volcano");
</script>
