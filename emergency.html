<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("diva_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emergency — DIVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-shell-root"></div>

<template id="emergency-content">
  <div class="diva-card diva-card-dark reveal-on-scroll mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3" style="background:linear-gradient(160deg, rgba(216,57,74,.3), transparent), linear-gradient(160deg, var(--navy-800), var(--navy-950) 75%); border-color:rgba(216,57,74,.35);">
    <div>
      <div class="card-eyebrow" style="margin-bottom:.4rem;"><span>Active threat nearby?</span></div>
      <div style="font-family:var(--font-display); font-weight:700; font-size:1.15rem;">Switch to Emergency Mode for a simplified, action-only view.</div>
    </div>
    <button type="button" class="btn-emergency" style="width:auto;" id="activateEmergencyBtn" data-press><i class="bi bi-broadcast dicon" data-dicon="broadcast"></i> ACTIVATE EMERGENCY MODE</button>
  </div>

  <div class="diva-card reveal-on-scroll mb-4">
    <div class="card-eyebrow"><span>Emergency Contacts</span></div>
    <div class="row g-3" id="contactGrid"></div>
  </div>

  <div class="diva-card reveal-on-scroll" id="evac">
    <div class="card-eyebrow"><span>Evacuation Centers</span><span class="demo-data-tag">DEMO DATA — sample LGU-style records</span></div>
    <div class="map-frame mb-3"><div id="evac-map"></div></div>
    <div class="d-flex flex-column gap-3" id="evacList"></div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/diva-auth.js"></script>
<script src="assets/js/main.js"></script>
<script type="module">
  await DivaAuth.init();
  const user = renderAppShell("emergency.html", { title: "Emergency" });

  // haversineKm() now lives in assets/js/main.js — shared across pages.
  function initEmergencyPage() {
    document.getElementById("app-content").appendChild(document.getElementById("emergency-content").content.cloneNode(true));

    document.getElementById("activateEmergencyBtn").addEventListener("click", () => DivaEmergencyMode.open());

    const contactGrid = document.getElementById("contactGrid");
    const iconMap = { Police: "bi-shield-lock", Fire: "bi-fire", Medical: "bi-heart-pulse", NDRRMC: "bi-diagram-3" };
    DIVA_DEMO.emergencyContacts.forEach((c) => {
      const col = document.createElement("div");
      col.className = "col-6 col-md-3";
      col.innerHTML = `
        <div class="text-center p-3" style="border:1px solid var(--surface-line); border-radius:14px;">
          <i class="bi ${iconMap[c.tag] || "bi-telephone"} fs-3 mb-2" style="color:var(--status-critical);"></i>
          <div style="font-size:.82rem; color:var(--ink-600); margin-bottom:.6rem;">${c.name}</div>
          <a href="tel:${c.number.replace(/[^\d+]/g, "")}" class="btn-emergency" data-press><i class="bi bi-telephone-fill"></i> CALL ${c.number}</a>
        </div>`;
      contactGrid.appendChild(col);
    });

    const userLat = 14.2117, userLng = 121.1653; // demo user location (Calamba, Laguna)
    const map = L.map("evac-map").setView([userLat, userLng], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
    L.marker([userLat, userLng], { icon: divaPinIcon("user", "bi-person-fill"), title: "You are here" }).addTo(map).bindPopup("Your approximate location");

    const evacList = document.getElementById("evacList");
    DIVA_DEMO.evacuationCenters
      .map((c) => ({ ...c, dist: haversineKm(userLat, userLng, c.lat, c.lng) }))
      .sort((a, b) => a.dist - b.dist)
      .forEach((c) => {
        L.marker([c.lat, c.lng], { icon: divaPinIcon("shelter", "bi-house-heart-fill") })
          .addTo(map)
          .bindPopup(`<strong>${c.name}</strong><br>${c.address}`);

        const el = document.createElement("div");
        el.className = "d-flex justify-content-between align-items-start gap-3 reveal-on-scroll";
        el.style.cssText = "border-bottom:1px solid var(--surface-line); padding-bottom:1rem;";
        el.innerHTML = `
          <div>
            <div style="font-weight:700; color:var(--navy-950);">${c.name}</div>
            <div style="font-size:.85rem; color:var(--ink-600);">${c.address}</div>
            <div style="font-size:.8rem; color:var(--ink-400);"><i class="bi bi-telephone"></i> ${c.contact} · ${c.facilities}</div>
          </div>
          <div class="text-end flex-shrink-0">
            <div style="font-weight:700; color:var(--accent-cyan);">${c.dist.toFixed(1)} km</div>
            <a class="btn-diva btn-diva-ghost btn-diva-sm mt-1" target="_blank" rel="noopener" href="https://www.openstreetmap.org/directions?to=${c.lat},${c.lng}"><i class="bi bi-signpost-split"></i> Directions</a>
          </div>`;
        evacList.appendChild(el);
      });

    initializeAnimations();
    setTimeout(() => map.invalidateSize(), 200);
  }

  if (user) initEmergencyPage();
</script>
</body>
</html>
