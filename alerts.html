<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("diva_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alerts — DIVA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-shell-root"></div>

<template id="alerts-content">
  <div class="d-flex flex-wrap gap-2 mb-4" id="alertFilters">
    <button class="btn-diva btn-diva-ghost btn-diva-sm active-filter" data-filter="all">All</button>
    <button class="btn-diva btn-diva-ghost btn-diva-sm" data-filter="critical">Critical</button>
    <button class="btn-diva btn-diva-ghost btn-diva-sm" data-filter="warning">Warning</button>
    <button class="btn-diva btn-diva-ghost btn-diva-sm" data-filter="advisory">Advisory</button>
  </div>
  <div class="d-flex flex-column gap-3" id="alertsList"></div>
  <div class="empty-state d-none" id="alertsEmpty">
    <div class="glyph"><i class="bi bi-check-circle dicon" data-dicon="check-circle"></i></div>
    <div>No active alerts in this category.</div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/diva-auth.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/voice-command.js"></script>
<script type="module">
  await DivaAuth.init();
  const user = renderAppShell("alerts.html", { title: "Alerts" });
  const severityMap = { information: "level-info", advisory: "level-advisory", warning: "level-warning", critical: "level-critical" };
  const statusMap = { information: "status-safe", advisory: "status-caution", warning: "status-warning", critical: "status-critical" };
  const typeIcon = { Typhoon: "bi-hurricane", Earthquake: "bi-activity", Volcanic: "bi-triangle", Flood: "bi-water", Landslide: "bi-layers", "General Emergency": "bi-exclamation-triangle" };

  async function renderAlerts(filter) {
    const list = document.getElementById("alertsList");
    const empty = document.getElementById("alertsEmpty");
    list.innerHTML = "";
    const { data: allAlerts, error } = await sb.from("alerts").select("*").order("created_at", { ascending: false });
    if (error) { console.error("Fetch alerts error:", error); return; }
    const items = allAlerts.filter((a) => filter === "all" || a.severity === filter);
    empty.classList.toggle("d-none", items.length > 0);
    items.forEach((a) => {
      const el = document.createElement("div");
      el.className = `alert-banner ${severityMap[a.severity]}`;
      const startFmt = new Date(a.starts_at).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      const expiresFmt = a.expires_at ? new Date(a.expires_at).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
      el.innerHTML = `<i class="bi ${typeIcon[a.type] || "bi-bell"} icon"></i>
        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <strong>${a.title}</strong>
            <span class="status-badge ${statusMap[a.severity]} ${a.severity === "critical" ? "badge-live" : ""}">${a.severity}</span>
          </div>
          <div style="font-size:.88rem; margin:.35rem 0;">${a.message}</div>
          <div class="data-source-line"><i class="bi bi-geo"></i> ${a.area} · <i class="bi bi-calendar3"></i> ${startFmt} – ${expiresFmt}</div>
        </div>`;
      list.appendChild(el);
      DivaAnim.animateAlertBanner(el, a.severity);
    });
  }

  function initAlertsPage() {
    document.getElementById("app-content").appendChild(document.getElementById("alerts-content").content.cloneNode(true));
    renderAlerts("all");
    document.querySelectorAll("#alertFilters button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#alertFilters button").forEach((b) => b.classList.remove("active-filter"));
        btn.classList.add("active-filter");
        renderAlerts(btn.dataset.filter);
      });
    });
  }

  if (user) initAlertsPage();
</script>
<style>.active-filter{background:var(--navy-950); color:#fff; border-color:var(--navy-950);}</style>
</body>
</html>
